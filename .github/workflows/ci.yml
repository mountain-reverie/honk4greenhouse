name: Continuous Integration

on:
  workflow_call:
    inputs:
      coverage:
        description: 'Enable coverage reporting'
        required: false
        type: boolean
        default: true
      benchmarks:
        description: 'Enable benchmark tests'
        required: false
        type: boolean
        default: true
    outputs:
      go-version:
        description: 'Go version used in CI'
        value: ${{ jobs.test.outputs.go-version }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Parse Go version from go.mod
        id: go-version
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          echo "version=${GO_VERSION}" >> $GITHUB_OUTPUT
          echo "Detected Go version: ${GO_VERSION}"

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@971e284b6050e8a5849b72094c50ab08da042db8 # v6.1.1
        with:
          version: latest
          args: --timeout=5m

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod or go.sum was modified after running 'go mod tidy'"
            exit 1
          fi

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    outputs:
      go-version: ${{ steps.go-version.outputs.version }}
      coverage-html: ${{ steps.coverage.outputs.html-report }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-latest-arm64
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Parse Go version from go.mod
        id: go-version
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          echo "version=${GO_VERSION}" >> $GITHUB_OUTPUT
          echo "Detected Go version: ${GO_VERSION}"

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: |
          go test -v -race -coverprofile=unit-coverage.out ./internal/...
          
      - name: Run integration tests
        run: |
          go test -v -race -coverprofile=integration-coverage.out ./internal/server/...

      - name: Run e2e tests
        run: |
          # E2E tests use testcontainers but work with local Docker daemon
          go test -v -timeout 10m -coverprofile=e2e-coverage.out ./test/e2e/...

      - name: Generate coverage reports
        id: coverage
        if: inputs.coverage
        run: |
          # Install coverage tools
          go install github.com/wadey/gocovmerge@latest
          
          # Combine coverage reports
          gocovmerge unit-coverage.out integration-coverage.out e2e-coverage.out > coverage.out
          
          # Generate HTML coverage report
          go tool cover -html=coverage.out -o coverage.html
          
          # Generate coverage summary
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage: $COVERAGE"
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "html-report=coverage.html" >> $GITHUB_OUTPUT
          
          # Create coverage badge data
          mkdir -p reports
          echo "{\"schemaVersion\": 1, \"label\": \"coverage\", \"message\": \"$COVERAGE\", \"color\": \"brightgreen\"}" > reports/coverage-badge.json

      - name: Upload coverage to Codecov
        if: inputs.coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d4895ce53c2b5bb8db1d3eb5 # v4.6.0
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Run benchmarks
        if: inputs.benchmarks
        run: |
          # Create reports directory
          mkdir -p reports
          
          # Run benchmarks and save results
          go test -bench=. -benchmem -count=3 -timeout=30m ./... | tee reports/benchmark.txt
          
          # Generate benchmark HTML report
          echo "<!DOCTYPE html>" > reports/benchmark.html
          echo "<html><head><title>Benchmark Results - honk4greenhouse</title>" >> reports/benchmark.html
          echo "<style>body{font-family:monospace;padding:20px;}</style></head>" >> reports/benchmark.html
          echo "<body><h1>Benchmark Results</h1><pre>" >> reports/benchmark.html
          cat reports/benchmark.txt >> reports/benchmark.html
          echo "</pre></body></html>" >> reports/benchmark.html

      - name: Test GoReleaser build
        uses: goreleaser/goreleaser-action@286f3b13d1b49da2a2e42a030cde8c5ceb33dba5 # v6.1.0
        with:
          distribution: goreleaser
          version: latest
          args: build --single-target --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test binary
        run: |
          # Find the built binary and test it
          BINARY=$(find dist/ -name "honk4greenhouse*" -type f -executable | head -1)
          if [ -n "$BINARY" ]; then
            echo "Testing binary: $BINARY"
            $BINARY --help || true
          else
            echo "No binary found in dist/"
            ls -la dist/
          fi

      - name: Upload reports for GitHub Pages
        if: (inputs.coverage || inputs.benchmarks) && matrix.arch == 'amd64'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: test-reports-${{ matrix.arch }}-${{ steps.go-version.outputs.version }}
          path: |
            reports/
            coverage.html
          retention-days: 30

      - name: Upload binary artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: honk4greenhouse-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.go-version.outputs.version }}
          path: dist/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Parse Go version from go.mod
        id: go-version
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          echo "version=${GO_VERSION}" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true

      - name: Install Gosec
        run: go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest

      - name: Run Gosec Security Scanner
        run: |
          gosec -fmt sarif -out gosec.sarif ./...

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@f3feb00acb00f31a6f60280e6ace9ca31d91c76a # v3.27.9
        if: always()
        with:
          sarif_file: gosec.sarif

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3feb00acb00f31a6f60280e6ace9ca31d91c76a # v3.27.9
        with:
          languages: go
          build-mode: automatic

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f3feb00acb00f31a6f60280e6ace9ca31d91c76a # v3.27.9
        with:
          category: "/language:go"

  prepare-gh-pages:
    name: Prepare GitHub Pages Reports
    runs-on: ubuntu-latest
    needs: test
    if: inputs.coverage || inputs.benchmarks
    steps:
      - name: Download all test reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: test-reports-*
          merge-multiple: true
          path: ./reports

      - name: Generate index page
        run: |
          mkdir -p gh-pages
          cat > gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>honk4greenhouse - Test Reports</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  .container { max-width: 800px; margin: 0 auto; }
                  .report-card { border: 1px solid #ddd; padding: 20px; margin: 20px 0; border-radius: 8px; }
                  .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; color: white; font-size: 12px; }
                  .success { background-color: #28a745; }
                  a { color: #007bff; text-decoration: none; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🏠 honk4greenhouse - Test Reports</h1>
                  <p>Automated test reports for the greenhouse design companion service.</p>
                  
                  <div class="report-card">
                      <h2>📊 Coverage Report</h2>
                      <p>Comprehensive test coverage analysis across unit, integration, and e2e tests.</p>
                      <a href="coverage.html">View Coverage Report →</a>
                  </div>
                  
                  <div class="report-card">
                      <h2>⚡ Performance Benchmarks</h2>
                      <p>Performance analysis and benchmark results for API endpoints and core functionality.</p>
                      <a href="reports/benchmark.html">View Benchmark Results →</a>
                  </div>
                  
                  <div class="report-card">
                      <h2>🔧 Latest Build</h2>
                      <p>Built with Go version: <span class="badge success">${{ needs.test.outputs.go-version }}</span></p>
                      <p>Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")</p>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Copy reports to gh-pages
        run: |
          cp -r reports/* gh-pages/ 2>/dev/null || true
          cp coverage.html gh-pages/ 2>/dev/null || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: github-pages
          path: gh-pages/
          retention-days: 1
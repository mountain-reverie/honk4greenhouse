name: Pull Request Validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write
  security-events: write

jobs:
  ci:
    name: Continuous Integration
    uses: ./.github/workflows/ci.yml
    with:
      coverage: true
      benchmarks: true

  pr-comment:
    name: PR Comment with Results
    runs-on: ubuntu-latest
    needs: ci
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Download test reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: test-reports-*
          merge-multiple: true
          path: ./reports

      - name: Generate PR comment
        id: comment
        run: |
          echo "## 🔍 Test Results" > pr-comment.md
          echo "" >> pr-comment.md
          
          if [ "${{ needs.ci.result }}" == "success" ]; then
            echo "✅ All tests passed!" >> pr-comment.md
            echo "" >> pr-comment.md
            
            # Add coverage info if available
            if [ -f "reports/coverage-badge.json" ]; then
              COVERAGE=$(jq -r '.message' reports/coverage-badge.json)
              echo "📊 **Coverage:** $COVERAGE" >> pr-comment.md
            fi
            
            # Add benchmark info if available
            if [ -f "reports/benchmark.txt" ]; then
              echo "⚡ **Benchmarks:** Available" >> pr-comment.md
            fi
          else
            echo "❌ Tests failed. Please check the workflow logs for details." >> pr-comment.md
          fi
          
          echo "" >> pr-comment.md
          echo "---" >> pr-comment.md
          echo "*This comment was automatically generated by the CI pipeline.*" >> pr-comment.md

      - name: Comment on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('pr-comment.md', 'utf8');
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🔍 Test Results')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  dependabot:
    name: Dependabot Auto-merge
    runs-on: ubuntu-latest
    needs: ci
    if: github.actor == 'dependabot[bot]' && needs.ci.result == 'success'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@5e5f99bf9de00b299ad1d5f8b2b9f8c60b2a8b9c # v2.2.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge Dependabot PRs
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}